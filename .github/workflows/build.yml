name: Build BarbellVBT Android APK

'on':
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install Android build system packages
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            ant \
            autoconf \
            automake \
            autopoint \
            build-essential \
            ccache \
            cmake \
            gettext \
            git \
            lbzip2 \
            libffi-dev \
            libltdl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            libtinfo6 \
            libtool \
            make \
            patch \
            pkg-config \
            python3-dev \
            unzip \
            wget \
            zip \
            zlib1g-dev

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Buildozer
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          . .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install 'Cython<3.0' buildozer
          buildozer --version

      - name: Build APK
        shell: bash
        run: |
          # IMPORTANT: activate the venv in THIS step too.
          # Buildozer checks $VIRTUAL_ENV to avoid calling pip with --user.
          source .venv/bin/activate
          echo "Using Python: $(which python)"
          echo "VIRTUAL_ENV=$VIRTUAL_ENV"
          buildozer -v android debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BarbellVBT-debug-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
